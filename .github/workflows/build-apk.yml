name: Build Android APK & Windows Exe

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies & Sync Capacitor
        run: |
          cd android
          npm install
          npx cap sync android

      - name: Build Debug APK via Gradle
        run: |
          cd android/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: arpanet-suite-apk
          path: android/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Windows Executable
        run: |
          go build -o arpanet.exe -ldflags="-H windowsgui" .

      - name: Upload Windows Exe
        uses: actions/upload-artifact@v4
        with:
          name: arpanet-suite-windows
          path: arpanet.exe
          retention-days: 14
