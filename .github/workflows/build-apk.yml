name: Build Android APK & Windows Exe

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Go for Android Cross-Compilation
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Cross-Compile Go Engine for Android ARM64
        run: |
          mkdir -p android/android/app/src/main/jniLibs/arm64-v8a
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -ldflags="-s -w" -o android/android/app/src/main/jniLibs/arm64-v8a/libarpanet.so .
          cp android/android/app/src/main/jniLibs/arm64-v8a/libarpanet.so ./arpanet-arm64
          chmod +x ./arpanet-arm64

      - name: Install Dependencies & Sync Capacitor
        run: |
          cd android
          npm install
          npx cap sync android

      - name: Build Debug APK via Gradle
        run: |
          cd android/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: arpanet-suite-apk
          path: android/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Go Android ARM64 Binary
        uses: actions/upload-artifact@v4
        with:
          name: arpanet-arm64-binary
          path: ./arpanet-arm64
          retention-days: 14

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Windows Executable
        run: |
          go build -o arpanet.exe -ldflags="-H windowsgui" .

      - name: Upload Windows Exe
        uses: actions/upload-artifact@v4
        with:
          name: arpanet-suite-windows
          path: arpanet.exe
          retention-days: 14
